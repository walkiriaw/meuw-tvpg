<!DOCTYPE html>
<html>
<head>
    <title>Video Player com Chromecast para GitHub Pages</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="//www.gstatic.com/cv/js/sender/fe_rpc_js.js"></script>

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-chromecast@3.0.0/dist/videojs-chromecast.min.css" rel="stylesheet" />

    <style>
        /* CSS para o player ocupar 100% da largura e ter o ícone do Chromecast visível */
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        .video-container { width: 100%; padding-top: 56.25%; position: relative; }
        .video-container .video-js { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Força a visibilidade do ícone (Cinza Inativo) */
        .video-js .vjs-chromecast-button {
            display: block !important;
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="my-video"
               class="video-js vjs-default-skin vjs-big-play-centered"
               controls
               preload="auto"
               data-setup='{}'>
            
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                    type="video/mp4">
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-chromecast@3.0.0/dist/videojs-chromecast.min.js"></script>

    <script>
        // Inicialização do Player e do Chromecast
        var player = videojs('my-video');
        
        player.chromecast({
            appId: 'CC1AD845' // ID Padrão do Google Default Media Receiver
        });
        
        player.on('error', function() {
            console.error('Erro ao tentar carregar o vídeo. Verifique o link ou a rede.');
        });
    </script>

</body>
</html>
