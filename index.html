<!DOCTYPE html>
<html>
<head>
    <title>Player Final: 100% Responsivo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="//www.gstatic.com/cv/js/sender/fe_rpc_js.js"></script>

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-chromecast@3.0.0/dist/videojs-chromecast.min.css" rel="stylesheet" />

    <style>
        /* CSS de Base */
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; /* Remove barra de rolagem horizontal */
            background-color: #000; 
        }

        /* 💡 CONFIGURAÇÃO RESPONSIVA: 100% Largura (16:9) */
        .video-container {
            width: 100%; 
            max-width: 100%; 
            padding-top: 56.25%; /* Proporção 16:9 */
            position: relative; 
            margin: 0 auto;
        }
        
        /* O Player preenche o contêiner */
        .video-container .video-js { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        }

        /* 2. CORREÇÃO CRÍTICA: GARANTE QUE A BARRA DE CONTROLE ESTEJA VISÍVEL */
        .video-js .vjs-control-bar {
            visibility: visible !important;
            opacity: 1 !important; 
            z-index: 2;
        }

        /* 3. Força a visibilidade do ícone do Chromecast (Cinza Inativo) */
        .video-js .vjs-chromecast-button {
            display: block !important;
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="my-video"
               class="video-js vjs-default-skin vjs-big-play-centered"
               controls
               preload="auto"
               data-setup='{}'>
            
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                    type="video/mp4">
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-chromecast@3.0.0/dist/videojs-chromecast.min.js"></script>

    <script>
        var player = videojs('my-video');
        
        // Função que inicializa o Chromecast APENAS depois que o Google Cast SDK está pronto
        function initializeChromecastPlayer() {
            player.chromecast({ appId: 'CC1AD845' });
        }

        // Tenta detectar se a API já carregou (o código otimizado)
        if (window.chrome && window.chrome.cast && window.chrome.cast.isAvailable) {
            initializeChromecastPlayer();
        } else {
            window.__onGCastApiAvailable = function(isAvailable) {
                if (isAvailable) {
                    initializeChromecastPlayer();
                }
            };
        }
    </script>

</body>teste
</html>
